name: Publish Gemmy release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to publish (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Attach Gemmy APK to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
      - name: Confirm APK exists
        run: test -s Gemmy-overlay.apk
      - name: Publish release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Gemmy ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            Gemmy-overlay.apk
