name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-project:
    name: Check Android project sources
    runs-on: ubuntu-latest
    outputs:
      project_exists: ${{ steps.check.outputs.project_exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Detect Gradle app module and wrapper
        shell: bash
        run: |
          if [[ -f app/build.gradle.kts && -f app/src/main/AndroidManifest.xml && -f gradle/wrapper/gradle-wrapper.properties && -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "project_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "project_exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android source module or Gradle wrapper is missing; build job will be skipped."
          fi

  build:
    name: Build and verify release APK
    needs: detect-project
    if: needs.detect-project.outputs.project_exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version
      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease
      - name: Verify APK exists and inspect package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No release APK produced." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "APK: $apk"
            sha256sum "$apk"
            apkanalyzer apk summary "$apk"
            apkanalyzer manifest permissions "$apk"
          done
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gemmy-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
